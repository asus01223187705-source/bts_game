<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameZone - اكسب عملات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#0a0a0f;color:#fff}
header{background:#111;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff0044}
.logo{font-size:28px;font-weight:bold;color:#ff0044}
.coins{background:#1a1a2e;padding:8px 15px;border-radius:20px;border:1px solid #ff0044}
.coins span{color:#ffd700;font-weight:bold}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin:20px 5%}
.card{background:#1a1a2e;border-radius:15px;overflow:hidden;border:1px solid #333}
.card img{width:100%;height:140px;background:#222;display:flex;align-items:center;justify-content:center;font-size:60px}
.card h3{padding:15px;font-size:16px}
.play-btn{background:#ff0044;color:#fff;text-align:center;padding:12px;margin:0 15px 15px;border-radius:8px;font-weight:bold;cursor:pointer}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;z-index:999}
.popup-content{background:#1a1a2e;padding:30px;border-radius:15px;text-align:center;max-width:400px;border:2px solid #ff0044}
.popup h2{color:#ffd700;margin-bottom:15px}
.popup button{background:#ff0044;color:#fff;border:none;padding:12px 30px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:15px}
footer{text-align:center;padding:30px;background:#111;margin-top:50px;color:#888}
@media(max-width:768px){.games{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
  <div class="logo">GameZone</div>
  <div class="coins">رصيدك: <span id="coins">0</span> 🪙</div>
</header>

<div class="games">
  <div class="card">
    <img>🚀</img>
    <h3>Sky Jump</h3>
    <div class="play-btn" onclick="watchAd()">العب الآن +50 عملة</div>
  </div>
  
  <div class="card">
    <img>🧩</img>
    <h3>Puzzle Master</h3>
    <div class="play-btn" onclick="watchAd()">العب الآن +50 عملة</div>
  </div>
  
  <div class="card">
    <img>🏎️</img>
    <h3>Speed Race</h3>
    <div class="play-btn" onclick="watchAd()">العب الآن +50 عملة</div>
  </div>
</div>

<!-- حط كود a-ads البانر هنا -->

<div class="popup" id="adPopup">
  <div class="popup-content">
    <h2>🎁 مكافأة المشاهدة</h2>
    <p>شاهد الإعلان 5 ثواني<br>وخد 50 GameCoin</p>
    
    <!-- حط كود a-ads Rewarded هنا -->
    <div style="margin:20px 0; min-height:250px; background:#222; display:flex; align-items:center; justify-content:center;">
      إعلان a-ads
    </div>
    
    <button onclick="closeAd()">تم - ادخل اللعبة</button>
  </div>
</div>

<footer>© GameZone 2026 - اربح من مشاهدة الإعلانات</footer>

<script>
let coins = localStorage.getItem('coins') || 0;
document.getElementById('coins').innerText = coins;

function watchAd(){
  document.getElementById('adPopup').style.display = 'flex';
}

function closeAd(){
  coins = parseInt(coins) + 50;
  localStorage.setItem('coins', coins);
  document.getElementById('coins').innerText = coins;
  document.getElementById('adPopup').style.display = 'none';
  alert('🎉 تم إضافة 50 عملة لرصيدك');
}
</script>

</body>
  </html>
